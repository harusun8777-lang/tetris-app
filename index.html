<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tetris Battle</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
</head>

<body>
  <div id="homeScreen" style="text-align:center; margin-top:40px;">
    <h1 class="home-title">テトリス</h1>
    <div class="home-score-display">
      <div class="score" id="homeScore">Score: 0</div>
      <p style="font-size: 12px; color: #999; margin: 5px 0 0 0;">前回のスコア</p>
    </div>

    <div class="match-mode">
      <label><input type="radio" name="mode" value="1" checked> シングルプレイ</label>
      <label><input type="radio" name="mode" value="2"> 2人プレイ</label>
    </div>

    <button class="startBtn" id="startBtn">スタート</button>
    <button id="showRankingBtn" class="secondary-btn">ランキングを見る</button>

    <div class="howto-box">
      <h2>操作説明</h2>

      <div class="howto-group">
        <h3>パソコン</h3>
        <ul>
          <li>左右: ← → /A D</li>
          <li>落下: ↓ 　/S </li>
          <li>回転: ↑ 　/W</li>
          <li>2人プレイ時は 1P: 矢印キー / 2P: A D S W</li>
        </ul>
      </div>

      <div class="howto-group">
        <h3>ケータイ</h3>
        <ul>
          <li>画面下のボタンで左右・落下・回転を操作</li>
          <li>モード選択は表示されず、シングルプレイ固定</li>
          <li>1列揃えると得点アップ</li>
          <li style="color:red">＊対戦モードできない</li>
        </ul>
      </div>
    </div>
  </div>

  <div class="match">
    <div class="game-panel">
      <div class="score" id="score1">Score: 0</div>
      <canvas id="game1" width="250" height="500"></canvas>
    </div>

    <div class="game-panel" id="player2Panel">
      <div class="score" id="score2">Score: 0</div>
      <canvas id="game2" width="250" height="500"></canvas>
    </div>
  </div>
  <div id="mobileControls">
    <button id="leftBtn">←</button>
    <button id="rightBtn">→</button>
    <button id="rotateBtn">⟳</button>
    <button id="downBtn">↓</button>
  </div>
  <div id="rankingScreen" style="display:none; text-align:center; margin-top:20px;">
    <div class="last-score-display">
      <div class="score" id="lastGameScore">Score: 0</div>
      <p id="lastGametext" style="font-size: 12px; color: #999; margin: 5px 0 0 0;">前回のスコア</p>
    </div>
    <h2>ランキング TOP5</h2>
    <div id="topScores" class="score"></div>
    <button id="backToGame">ホームに戻る</button>
  </div>
  
  <script src="js/game.js"></script>
  <script src="js/riset.js"></script>
  <script src="js/start.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/mobile-controls.js"></script>
  <script src="js/home.js"></script>
</body>

</html>
